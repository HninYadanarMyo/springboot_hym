<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>ATM Dashboard</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .atm-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            background: #ffffff;
            transition: transform 0.3s;
        }
        .atm-card:hover {
            transform: translateY(-5px);
        }
        .brand-icon {
            font-size: 3rem;
            color: #007bff;
            margin-bottom: 15px;
        }
        .or-divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #6c757d;
            margin: 20px 0;
        }
        .or-divider::before, .or-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #dee2e6;
        }
        .or-divider:not(:empty)::before { margin-right: .25em; }
        .or-divider:not(:empty)::after { margin-left: .25em; }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-sm-8">
            <div class="card atm-card p-5 text-center">

                <div class="brand-icon">
                    <i class="fas fa-university"></i>
                </div>
                <h2 class="font-weight-bold text-dark mb-2">Welcome to ATM</h2>
                <p class="text-muted mb-4">Please login to your account or create a new one to get started.</p>

                <div class="d-flex flex-column">
                    <a th:href="@{/login}" class="btn btn-primary btn-lg shadow-sm mb-2">
                        <i class="fas fa-sign-in-alt mr-2"></i>Login to Account
                    </a>

                    <div class="or-divider">OR</div>

                    <a th:href="@{/register}" class="btn btn-outline-success btn-lg">
                        <i class="fas fa-user-plus mr-2"></i>Register New Account
                    </a>
                </div>

                <div class="mt-4 pt-3 border-top text-left text-muted" style="font-size: 0.85rem;">
                    <i class="fas fa-lock text-success mr-1"></i> Secure 256-bit SSL Banking Encryption.
                </div>

            </div>
        </div>
    </div>
</div>

</body>
</html>
