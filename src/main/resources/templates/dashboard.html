<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>User Dashboard</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center">
        <h1 class="h3 mb-0">Dashboard</h1>
        <div>
            <a th:href="@{/history}" class="btn btn-outline-secondary btn-sm">History</a>
            <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm">Logout</a>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col-md-4">
            <h2 class="h5">Your Information</h2>
            <table class="table table-sm table-bordered">
                <tr><th>ID</th><td th:text="${currentAccount.id}"></td></tr>
                <tr><th>Name</th><td th:text="${currentAccount.name}"></td></tr>
                <tr><th>Email</th><td th:text="${currentAccount.email}"></td></tr>
                <tr><th>Address</th><td th:text="${currentAccount.address}"></td></tr>
                <tr><th>Phone</th><td th:text="${currentAccount.phoneNumber}"></td></tr>
                <tr>
                    <th>Balance</th>
                    <td>
                        <button id="balanceBtn" class="btn btn-primary btn-sm" onclick="toggleBalance()">
                            <i class="fas fa-eye mr-1"></i> Check Balance
                        </button>
                        <span id="balanceText" style="display: none;" class="font-weight-bold text-success">
                            <span th:text="${#numbers.formatDecimal(currentAccount.balance, 1, 2)}"></span> MMK
                            <button class="btn btn-link btn-sm text-muted p-0 ml-2" onclick="toggleBalance()">
                                <i class="fas fa-eye-slash"></i>
                            </button>
                        </span>
                    </td>
                </tr>
            </table>
        </div>

        <div class="col-md-8">
            <h2 class="h5">Actions</h2>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <form th:action="@{/deposit}" method="post" class="border p-3">
                        <h3 class="h6">Deposit Money</h3>
                        <input type="number" step="0.01" min="0.01" name="amount" class="form-control mb-2" placeholder="Amount" required>
                        <button type="submit" class="btn btn-primary btn-sm">Deposit</button>
                    </form>
                </div>
                <div class="col-md-6 mb-3">
                    <form th:action="@{/withdraw}" method="post" class="border p-3">
                        <h3 class="h6">Withdraw Money</h3>
                        <input type="number" step="0.01" min="0.01" name="amount" class="form-control mb-2" placeholder="Amount" required>
                        <button type="submit" class="btn btn-primary btn-sm">Withdraw</button>
                    </form>
                </div>
                <div class="col-md-6 mb-3">
                    <form th:action="@{/transfer}" th:object="${transferInfo}" method="post" class="border p-3">
                        <h3 class="h6">Transfer Money</h3>
                        <input type="text" name="receiverPhone" class="form-control mb-2" placeholder="Receiver phone number" required>
                        <input type="number" step="0.01" min="0.01" name="amount" class="form-control mb-2" placeholder="Amount" required>
                        <input type="password" name="password" class="form-control mb-2" placeholder="Your password" required>
                        <button type="submit" class="btn btn-primary btn-sm">Transfer</button>
                    </form>
                </div>
                <div class="col-md-6 mb-3">
                    <form th:action="@{/topup}" method="post" class="border p-3">
                        <h3 class="h6">Top Up</h3>
                        <input type="number" step="0.01" min="0.01" name="amount" class="form-control mb-2" placeholder="Amount" required>
                        <button type="submit" class="btn btn-primary btn-sm">Top Up</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleBalance() {
        var btn = document.getElementById("balanceBtn");
        var text = document.getElementById("balanceText");
        if (text.style.display === "none") {
            text.style.display = "inline";
            btn.style.display = "none";
        } else {
            text.style.display = "none";
            btn.style.display = "inline";
        }
    }
</script>
</body>
</html>
