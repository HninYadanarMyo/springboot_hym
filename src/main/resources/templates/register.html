<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="ISO-8859-1">
    <title>ATM Management System</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
</head>
<body>
<div class="container my-4">
    <h1>ATM Management System</h1>
    <hr>
    <h2>Register Account</h2>

    <form action="#" th:action="@{/registerAccount}" th:object="${registerInfo}" method="POST">

        <div class="form-group">
            <label class="font-weight-bold">Account Name</label>
            <input type="text" th:field="*{name}" placeholder="Enter Account Name"
                   class="form-control col-md-4" required>
        </div>

        <div class="form-group">
            <label class="font-weight-bold">Account Email</label>
            <input type="email" th:field="*{email}" placeholder="Enter Account Email"
                   class="form-control col-md-4" required>
        </div>

        <div class="form-group">
            <label class="font-weight-bold">Account Password</label>
            <input type="password" th:field="*{password}" placeholder="Enter Account Password"
                   class="form-control col-md-4" required>
        </div>

        <div class="form-group">
            <label class="font-weight-bold">Account Address</label>
            <input type="text" th:field="*{address}" placeholder="Enter Account Address"
                   class="form-control col-md-4" required>
        </div>

        <div class="form-group">
            <label class="font-weight-bold">Account Phone Number</label>
            <input type="text" th:field="*{phoneNumber}" placeholder="Enter Account Phone Number"
                   class="form-control col-md-4" required>
        </div>

        <button type="submit" class="btn btn-info col-md-2 mt-2">Register</button>
    </form>

    <hr>

    <a th:href="@{/}" class="btn btn-secondary btn-sm">Back to Account List</a>
</div>
</body>
</html>
