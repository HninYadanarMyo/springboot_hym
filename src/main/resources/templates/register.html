<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="ISO-8859-1">
    <title>ATM Management System</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
</head>
<body>
<div class="container my-4">
    <h1>ATM Management System</h1>
    <hr>
    <h2>Register Account</h2>

    <form action="#" th:action="@{/registerAccount}" th:object="${registerInfo}" method="POST">
        <input type="text" th:field="*{name}" placeholder="Account Name"
               class="form-control mb-4 col-4" required>

        <input type="text"
               th:field="*{email}" placeholder="Account Email"
               class="form-control mb-4 col-4" required>

        <input type="password"
               th:field="*{password}" placeholder="Account Password"
               class="form-control mb-4 col-4" required>

        <input type="text"
               th:field="*{address}" placeholder="Account Address"
               class="form-control mb-4 col-4">

        <input type="text"
               th:field="*{phoneNumber}" placeholder="Account phone Number"
               class="form-control mb-4 col-4" required>

        <div class="form-group mb-4">
            <label class="d-block font-weight-bold">Select Account Type / Role:</label>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" th:field="*{role}" id="roleUser" value="USER" checked>
                <label class="form-check-label" for="roleUser">User</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" th:field="*{role}" id="roleAdmin" value="ADMIN">
                <label class="form-check-label" for="roleAdmin">Admin</label>
            </div>
        </div>

        <button type="submit" class="btn btn-info col-2"> Register</button>
    </form>

    <hr>

    <a th:href="@{/}"> Back to Home</a>
</div>
</body>
</html>
