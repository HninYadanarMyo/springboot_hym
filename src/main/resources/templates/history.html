<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>Transaction History</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
</head>
<body>
<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center">
        <h1 class="h3 mb-0">Transaction History</h1>
        <div>
            <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-sm">Dashboard</a>
            <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm">Logout</a>
        </div>
    </div>

    <div class="mt-3">
        <strong>Name:</strong> <span th:text="${currentAccount.name}"></span>
        <span class="ml-3"><strong>Balance:</strong> <span th:text="${#numbers.formatDecimal(currentAccount.balance, 1, 2)}"></span></span>
    </div>

    <h2 class="h5 mt-4">All Transactions</h2>
    <table class="table table-sm table-striped table-bordered">
        <thead class="thead-light">
        <tr>
            <th>ID</th>
            <th>Created At</th>
            <th>Type</th>
            <th>Amount</th>
            <th>Previous Balance</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(transactions)}">
            <td colspan="5" class="text-center">No transaction history.</td>
        </tr>
        <tr th:each="tx : ${transactions}">
            <td th:text="${tx.id}"></td>
            <td th:text="${#temporals.format(tx.createdAt, 'dd MMM yyyy, hh:mm:ss a')}"></td>
            <td th:text="${tx.transactionType}"></td>
            <td th:text="${#numbers.formatDecimal(tx.amount, 1, 2)}"></td>
            <td th:text="${#numbers.formatDecimal(tx.previousAmount, 1, 2)}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
