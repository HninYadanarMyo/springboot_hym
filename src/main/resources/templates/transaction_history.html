<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="ISO-8859-1">
    <title>Transaction History</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
</head>
<body>
<div class="container my-4">
    <h1>ATM Management System</h1>
    <hr>
    <h2>Transaction History (Account ID: <span th:text="${accountId}"></span>)</h2>

    <div th:if="${not #lists.isEmpty(transactions)}">
        <table class="table table-striped table-bordered table-hover mt-3">
            <thead class="thead-dark">
            <tr>
                <th>Transaction ID</th>
                <th>Type</th>
                <th>Amount</th>
                <th>Previous Balance</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="tx : ${transactions}">
                <td th:text="${tx.id}"></td>
                <td>
                    <span th:if="${tx.transactionType.name() == 'DEPOSIT'}" class="badge badge-success">DEPOSIT</span>
                    <span th:if="${tx.transactionType.name() == 'WITHDRAW'}" class="badge badge-danger">WITHDRAW</span>
                    <span th:if="${tx.transactionType.name() == 'TOP_UP'}" class="badge badge-info">TOP_UP</span>
                    <span th:if="${tx.transactionType.name() == 'TRANSFER'}" class="badge badge-warning">TRANSFER</span>
                </td>
                <td th:text="${tx.amount} + ' Ks'" class="font-weight-bold"></td>
                <td th:text="${tx.previousAmount} + ' Ks'"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${#lists.isEmpty(transactions)}" class="alert alert-secondary mt-3">
        No transaction history found for this account.
    </div>

    <hr>
    <a th:href="@{/}" class="btn btn-secondary btn-sm">Back to Account List</a>
</div>
</body>
</html>
